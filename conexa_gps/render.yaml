# Public pilot only. Requires review and an approved Render workspace before deployment.
services:
  - type: web
    name: conexa-gps-publico
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: conexa-gps-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.9

databases:
  - name: conexa-gps-db
    plan: free
    region: ohio
    databaseName: conexagps
    user: conexagps
