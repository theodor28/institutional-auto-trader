services:
  - type: web
    name: conexa-gps-publico
    runtime: python
    plan: free
    region: virginia
    rootDir: conexa_gps
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: conexa-gps-db-20261119
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.9

databases:
  - name: conexa-gps-db-20261119
    plan: free
    region: virginia
    databaseName: conexa_gps_db_20261119
    user: conexa_gps_db_20261119_user
