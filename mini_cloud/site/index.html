<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>STEINER MINI OS — Desktop</title><link rel="stylesheet" href="style.css"></head><body>
<main id="desktop" aria-label="Área de trabalho virtual"><div id="deskTop"><strong>STEINER MINI OS</strong><span>Seu computador de bolso, dentro do navegador</span></div><div id="icons" aria-label="Atalhos da área de trabalho"></div><div class="desktop-note">Ambiente virtual independente • seus arquivos reais não são alterados<br><span id="desktopClock">--:--</span></div><div id="windows"></div></main>
<div id="startMenu" aria-label="Menu Iniciar"><div class="start-header">Boa hora de criar algo ✨</div><input id="appSearch" class="start-search" placeholder="Pesquisar aplicativos..." autocomplete="off"><div class="start-sub">APLICATIVOS</div><div id="startApps" class="start-grid"></div><div class="start-foot"><span>◉ STEINER MINI OS · v1.0</span><span>Local • Sem contas • Sem anúncios</span></div></div>
<footer id="taskbar"><button class="task-start" id="startBtn" title="Abrir Iniciar">⊞</button><div class="task-zone" id="taskApps"></div><div class="task-right"><span class="netstatus" title="Modo local">◉ Local</span><button class="clock-btn" id="clockBtn" title="Relógio"></button></div></footer>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
