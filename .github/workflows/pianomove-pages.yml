name: Deploy PianoMove to GitHub Pages
on:
  push:
    branches: [pianomove-brand-site-2026]
    paths:
      - 'pianomove_site/**'
      - '.github/workflows/pianomove-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pianomove-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pianomove_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
